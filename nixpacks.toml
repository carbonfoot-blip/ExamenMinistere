[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[phases.build]
cmds = [
  "cd frontend && npm install && npm run build && mkdir -p ../backend/static && cp -r dist/* ../backend/static/"
]

[start]
cmd = "cd backend && pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port $PORT"